name: Daily Sports Data Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # 9:00 AM US Eastern, every day
  workflow_dispatch: {}     # adds a manual "Run workflow" button too

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull today's results (safe to re-run, skips duplicates)
        continue-on-error: true
        run: |
          python ingest_results_espn.py --sport mlb --today
          python ingest_results_espn.py --sport wnba --today
          python ingest_results_espn.py --sport nfl --today
          python ingest_results_espn.py --sport ncaaf --today

      - name: Re-check yesterday's finals (catches games that ended after yesterday's run)
        continue-on-error: true
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          python ingest_results_espn.py --sport mlb --start $YESTERDAY --end $YESTERDAY
          python ingest_results_espn.py --sport wnba --start $YESTERDAY --end $YESTERDAY
          python ingest_results_espn.py --sport nfl --start $YESTERDAY --end $YESTERDAY
          python ingest_results_espn.py --sport ncaaf --start $YESTERDAY --end $YESTERDAY

      - name: Pull yesterday's MLB bullpen usage (official MLB Stats API, free)
        continue-on-error: true
        run: python ingest_bullpen_usage.py

      - name: Pull today's odds (The Odds API)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python ingest_odds_theoddsapi.py --sport mlb
          python ingest_odds_theoddsapi.py --sport wnba
          python ingest_odds_theoddsapi.py --sport nfl
          python ingest_odds_theoddsapi.py --sport ncaaf

      - name: Pull public betting data (VSiN, real DraftKings handle%/bet%, free)
        continue-on-error: true
        run: |
          python ingest_public_betting_vsin.py --sport mlb
          python ingest_public_betting_vsin.py --sport wnba
          python ingest_public_betting_vsin.py --sport nfl
          python ingest_public_betting_vsin.py --sport ncaaf

      - name: Compute signals
        continue-on-error: true
        run: python signals.py

      - name: Generate today's recommendations
        continue-on-error: true
        run: |
          python recommend.py --sport mlb
          python recommend.py --sport wnba
          python recommend.py --sport nfl
          python recommend.py --sport ncaaf

      - name: Grade past recommendations against finished games
        continue-on-error: true
        run: python grade_recommendations.py

      - name: Build dashboard
        run: |
          python dashboard.py
          mkdir -p docs
          cp data/dashboard.html docs/index.html

      - name: Save today's data + dashboard back to the repo
        run: |
          git config user.name "sports-edge-bot"
          git config user.email "actions@github.com"
          git add data docs
          git commit -m "Daily update $(date +'%Y-%m-%d')" || echo "Nothing new to commit"
          git push
