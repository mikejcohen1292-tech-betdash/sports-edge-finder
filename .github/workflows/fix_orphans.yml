name: One-Time Orphan Game Repair

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Purge stale pre-switchover odds data
        run: python purge_stale_odds.py

      - name: Pull fresh odds from The Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python ingest_odds_theoddsapi.py --sport mlb
          python ingest_odds_theoddsapi.py --sport wnba
          python ingest_odds_theoddsapi.py --sport nfl
          python ingest_odds_theoddsapi.py --sport ncaaf

      - name: Compute fresh signals from clean data
        run: python signals.py

      - name: Reconcile orphaned games
        run: python fix_orphan_games.py

      - name: Re-grade recommendations now that IDs are fixed
        run: python grade_recommendations.py

      - name: Rebuild dashboard
        run: |
          python dashboard.py
          mkdir -p docs
          cp data/dashboard.html docs/index.html

      - name: Save to repo
        run: |
          git config user.name "sports-edge-bot"
          git config user.email "actions@github.com"
          git add data docs
          git commit -m "Orphan game repair" || echo "Nothing new to commit"
          git push
